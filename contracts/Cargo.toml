[workspace]
resolver = "2"
members = ["traceability"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Profile used by `stellar contract build` for release artifacts with debug info.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
