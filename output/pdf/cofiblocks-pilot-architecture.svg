<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">CofiBlocks Traceability - Ethiopia pilot target architecture</title>
<desc id="desc">Target architecture: farmers use a VoiceLedger Telegram bot; cooperative and union staff use a web app with Cavos wallets. A backend validates events, stores private records off-chain, and submits authorized transactions to Stellar Testnet. This diagram describes the target design rather than implementation progress.</desc>
